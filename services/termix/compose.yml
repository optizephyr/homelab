# Optional — not required if SSH is enough.
# Official image: https://docs.termix.site/install/server/docker
services:
  termix:
    profiles: ["termix"]
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    environment:
      # Align with Caddy reverse_proxy termix:8080
      PORT: "8080"
    volumes:
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/termix:/app/data
    networks:
      - homelab

networks:
  homelab:
    name: homelab
