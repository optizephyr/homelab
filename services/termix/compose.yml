# Optional — not required if SSH is enough.
# Set TERMIX_IMAGE in .env after confirming the upstream image.
services:
  termix:
    profiles: ["termix"]
    image: ${TERMIX_IMAGE:-public.ecr.aws/termix/termix:placeholder}
    container_name: termix
    restart: unless-stopped
    environment:
      # Align with nginx proxy_pass http://termix:8080
      PORT: "8080"
    networks:
      - homelab


networks:
  homelab:
    name: homelab
