# Custom Tailscale DERP — VPS only (not runnable on Workers / edge functions).
# Prefer host networking; follow upstream derper docs for certs and STUN.
# https://tailscale.com/docs/reference/derp-servers/custom-derp-servers
services:
  tailscale-derp:
    profiles: ["tailscale-derp"]
    image: ${TAILSCALE_DERP_IMAGE:-ghcr.io/fredliang44/derper:latest}
    container_name: tailscale-derp
    restart: unless-stopped
    network_mode: host
    environment:
      DERP_DOMAIN: ${TAILSCALE_DERP_DOMAIN:-}
      DERP_VERIFY_CLIENTS: ${TAILSCALE_DERP_VERIFY_CLIENTS:-false}
    volumes:
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/tailscale-derp/certs:/app/certs
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/tailscale-derp/data:/var/lib/derper
