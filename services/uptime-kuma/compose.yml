services:
  uptime-kuma:
    profiles: ["uptime-kuma"]
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/uptime-kuma:/app/data
    networks:
      - homelab
    # Expose only via Caddy on the homelab network.
    # ports:
    #   - "3001:3001"

networks:
  homelab:
    name: homelab
