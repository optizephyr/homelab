services:
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: homelab-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/caddy/data:/data
      - ${DATA_ROOT:-${COMPOSE_PROJECT_DIR}/data}/caddy/config:/config
    networks:
      - homelab

networks:
  homelab:
    name: homelab
